[build]
builder = "NIXPACKS"
buildCommand = "NODE_ENV=development npm install && npm run build"

[deploy]
startCommand = "node --max-old-space-size=2048 server/index.js"
healthcheckPath = "/api/fechas-rango"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[volumes]]
mountPath = "/app/data"
