<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imprimiendo etiquetas…</title>
<style>
  html, body { margin: 0; height: 100%; }
  iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
  <iframe id="pdf-frame" src="{{ pdf_url }}"></iframe>
  <script>
    // Dispara el diálogo de impresión solo con cargar esta página, en vez de
    // obligar a abrir el PDF y encima tocar el ícono de imprimir del visor.
    const frame = document.getElementById('pdf-frame');
    frame.addEventListener('load', () => {
      setTimeout(() => {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      }, 300);
    });
    // Se cierra sola al terminar (imprimir o cancelar) — la pestaña de
    // etiquetas que abrió esto sigue el flujo al detectar que se cerró.
    window.addEventListener('afterprint', () => window.close());
  </script>
</body>
</html>
