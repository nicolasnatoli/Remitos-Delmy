<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — Depósito Delmy</title>
<style>
  :root { --azul: #0b3d91; --azul-osc: #082a66; --rojo: #c0392b; --blanco: #ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--azul) 0%, var(--azul-osc) 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .card {
    width: 360px; background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  .card header {
    background: var(--blanco); color: #111; padding: 32px 24px 22px; text-align: center;
    border-bottom: 3px solid var(--rojo);
  }
  .card header img { height: 44px; margin-bottom: 8px; }
  .card header h1 { font-size: 18px; margin: 0; }
  form { padding: 24px; }
  label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 4px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; margin-bottom: 16px;
  }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--rojo);
    color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #9c2c20; }
  .msg-error { background: #fff0f0; color: var(--rojo); border: 1px solid #f3c9c4; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  .msg-timeout { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <img src="{{ url_for('static', filename='logo.png') }}" alt="" onerror="this.style.display='none'">
      <h1>Depósito Delmy</h1>
    </header>
    <form method="post">
      {% if error %}<div class="msg-error">{{ error }}</div>{% endif %}
      {% if timeout %}<div class="msg-timeout">Tu sesión expiró, ingresá de nuevo.</div>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>Usuario</label>
      <input type="text" name="username" autocomplete="username" required autofocus>
      <label>Contraseña</label>
      <input type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
