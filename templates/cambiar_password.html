{% extends "base.html" %}
{% block title %}Cambiar contraseña — Depósito Delmy{% endblock %}
{% block content %}
<div class="card" style="max-width:420px; margin: 40px auto;">
  <h2 style="margin-top:0;">Cambiar contraseña</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% if ok %}<div class="ok">Contraseña actualizada correctamente.</div>{% endif %}
  <form method="post">
    <div class="campo">
      <label>Contraseña actual</label>
      <input type="password" name="actual" required>
    </div>
    <div class="campo">
      <label>Nueva contraseña</label>
      <input type="password" name="nueva" required minlength="6">
    </div>
    <div class="campo">
      <label>Confirmar nueva contraseña</label>
      <input type="password" name="confirmar" required minlength="6">
    </div>
    <button class="btn" type="submit">Guardar</button>
  </form>
</div>
{% endblock %}
